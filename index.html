<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shandalf vs Rippling Bot</title>
  <style>
    :root {
      --ink: #1d2b53;
      --deep: #7e2553;
      --mid: #29adff;
      --glow: #ffcc00;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--ink);
      color: var(--glow);
      font-family: "Courier New", Courier, monospace;
    }

    body {
      display: grid;
      place-items: center;
      padding: 24px;
      overflow-x: hidden;
    }

    main {
      width: min(100%, 1120px);
    }

    .masthead {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 14px;
      text-transform: uppercase;
    }

    .eyebrow {
      margin: 0 0 5px;
      color: var(--mid);
      font-size: clamp(10px, 1.5vw, 13px);
      letter-spacing: 3px;
    }

    h1 {
      margin: 0;
      color: var(--glow);
      font-size: clamp(22px, 4vw, 40px);
      letter-spacing: 2px;
      line-height: 1;
      text-shadow: 3px 3px var(--deep);
    }

    .round-label {
      padding: 8px 10px;
      border: 2px solid var(--deep);
      color: var(--mid);
      font-size: 11px;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    .cabinet {
      border: 4px solid var(--deep);
      background: var(--deep);
      box-shadow: 0 0 0 4px var(--ink), 0 0 0 7px var(--deep);
    }

    .screen-wrap {
      position: relative;
      background: var(--ink);
      aspect-ratio: 16 / 9;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .status {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
    }

    .status-message {
      display: none;
      padding: 13px 18px;
      border: 3px solid var(--glow);
      background: var(--ink);
      color: var(--glow);
      text-align: center;
      text-transform: uppercase;
      font-size: clamp(12px, 2vw, 18px);
      line-height: 1.45;
      letter-spacing: 2px;
      box-shadow: 6px 6px 0 var(--deep);
    }

    .status-message.visible { display: block; }

    .controls {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 18px;
      padding: 13px 16px;
      border-top: 4px solid var(--deep);
      background: var(--ink);
    }

    .key-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      color: var(--mid);
      font-size: 11px;
      line-height: 1.5;
      text-transform: uppercase;
    }

    .key-list span { white-space: nowrap; }

    kbd {
      display: inline-block;
      min-width: 23px;
      margin-right: 4px;
      padding: 3px 5px;
      border: 2px solid var(--mid);
      color: var(--glow);
      text-align: center;
      font-weight: 700;
    }

    .tip {
      color: var(--mid);
      font-size: 10px;
      letter-spacing: 1px;
      text-align: right;
      text-transform: uppercase;
    }

    @media (max-width: 640px) {
      body { padding: 13px; }
      .masthead { align-items: start; flex-direction: column; gap: 10px; }
      .round-label { align-self: stretch; text-align: center; }
      .controls { grid-template-columns: 1fr; }
      .tip { text-align: left; }
      .key-list { gap: 8px 10px; }
    }
  </style>
</head>
<body>
  <main>
    <header class="masthead">
      <div>
        <p class="eyebrow">Pocket Arena // Sector 08</p>
        <h1>Shandalf <span aria-hidden="true">vs</span> Rippling Bot</h1>
      </div>
      <div class="round-label">Round <span id="roundNumber">01</span> // Live</div>
    </header>

    <section class="cabinet" aria-label="Shandalf versus Rippling Bot game">
      <div class="screen-wrap">
        <canvas id="game" width="960" height="540" aria-label="Arcade fighting game canvas"></canvas>
        <div class="status"><div id="statusMessage" class="status-message"></div></div>
      </div>
      <div class="controls">
        <div class="key-list">
          <span><kbd>←</kbd><kbd>→</kbd> Move</span>
          <span><kbd>↑</kbd> Jump</span>
          <span><kbd>A</kbd> Attack</span>
          <span><kbd>S</kbd> Shield</span>
        </div>
        <div class="tip">Land the spell. Keep your distance.</div>
      </div>
    </section>
  </main>

  <script>
    (() => {
      "use strict";

      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const statusMessage = document.getElementById("statusMessage");
      const roundNumber = document.getElementById("roundNumber");

      const COLORS = {
        ink: "#1D2B53",
        deep: "#7E2553",
        mid: "#29ADFF",
        glow: "#FFCC00",
        gold: "#FFCC00",
        white: "#FFF1E8",
        green: "#00E436",
        red: "#FF004D",
        blueDark: "#1D5B8F",
        purple: "#AB3472",
        black: "#0F1021"
      };
      const WORLD = { width: 960, height: 540, floor: 442 };
      const keys = new Set();
      let projectiles = [];
      let particles = [];
      let round = 1;
      let gameState = "title";
      let gameOver = false;
      let lastTime = performance.now();
      let botThink = 0;
      let selectedOpponentIndex = 0;
      let chosenOpponent = null;
      let screenShake = 0;
      const superMove = {
        active: false,
        timer: 0,
        damageApplied: false,
        inputLock: false
      };

      function createSpriteImage(svg) {
        const image = new Image();
        image.src = `data:image/svg+xml,${encodeURIComponent(svg)}`;
        return image;
      }

      const opponentOptions = [
        {
          name: "RIPPLING BOT",
          color: COLORS.red,
          accent: COLORS.mid,
          speed: 1.35,
          health: 80,
          sprite: null
        },
        {
          name: "FACTORIAL MECH",
          color: "#FFA300",
          accent: COLORS.ink,
          speed: 0.8,
          health: 130,
          sprite: createSpriteImage(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 90" shape-rendering="crispEdges"><path fill="#FFA300" d="M22 2h36v8h8v12h6v28H60v30H48v8H32v-8H20V50H8V22h6V10h8z"/><path fill="#1D2B53" d="M14 22h52v28H14zM20 58h40v22H20z"/><path fill="#FFCC00" d="M26 30h28v8H26zM31 60h18v12H31z"/><path fill="#1D2B53" d="M29 12h8v8h-8zM43 12h8v8h-8zM8 34h10v10H8zM62 34h10v10H62z"/></svg>`)
        },
        {
          name: "HIBOB CYBORG",
          color: "#FF77A8",
          accent: COLORS.ink,
          speed: 1.1,
          health: 100,
          sprite: createSpriteImage(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 90" shape-rendering="crispEdges"><path fill="#FF77A8" d="M20 2h40v8h8v12h6v30H60v28H48v8H32v-8H20V52H6V22h6V10h8z"/><path fill="#1D2B53" d="M14 22h52v30H14zM20 58h40v22H20z"/><path fill="#FF004D" d="M24 30h32v8H24zM31 60h18v12H31z"/><path fill="#1D2B53" d="M29 12h8v8h-8zM43 12h8v8h-8zM6 36h12v10H6zM62 36h12v10H62z"/></svg>`)
        }
      ];

      const player = createFighter({
        name: "SHANDALF",
        x: 220,
        color: COLORS.glow,
        accent: COLORS.mid,
        facing: 1,
        isPlayer: true
      });
      const bot = createFighter({
        ...opponentOptions[0],
        x: 740,
        facing: -1,
        isPlayer: false
      });
      chosenOpponent = opponentOptions[0];

      function createFighter(options) {
        return {
          ...options,
          y: WORLD.floor,
          vx: 0,
          vy: 0,
          width: 54,
          height: 88,
          health: options.health || 100,
          maxHealth: options.health || 100,
          grounded: true,
          attackCooldown: 0,
          attackTimer: 0,
          hurtTimer: 0,
          flashTimer: 0,
          walkCycle: 0,
          jumpLock: false
        };
      }

      function configureOpponent(opponent) {
        chosenOpponent = opponent;
        bot.name = opponent.name;
        bot.color = opponent.color;
        bot.accent = opponent.accent;
        bot.speed = opponent.speed;
        bot.maxHealth = opponent.health;
        bot.health = opponent.health;
        bot.sprite = opponent.sprite;
      }

      function resetRound() {
        player.x = 220;
        player.y = WORLD.floor;
        player.vx = 0;
        player.vy = 0;
        player.health = 100;
        player.grounded = true;
        player.attackCooldown = 0;
        player.attackTimer = 0;
        player.hurtTimer = 0;
        bot.x = 740;
        bot.y = WORLD.floor;
        bot.vx = 0;
        bot.vy = 0;
        bot.health = bot.maxHealth;
        bot.grounded = true;
        bot.attackCooldown = 0;
        bot.attackTimer = 0;
        bot.hurtTimer = 0;
        superMove.active = false;
        superMove.timer = 0;
        superMove.damageApplied = false;
        superMove.inputLock = false;
        screenShake = 0;
        projectiles = [];
        particles = [];
        gameOver = false;
        statusMessage.classList.remove("visible");
        roundNumber.textContent = String(round).padStart(2, "0");
      }

      function handleKeyDown(event) {
        const key = event.key.toLowerCase();
        if (["arrowleft", "arrowright", "arrowup", "arrowdown", "a", "s", "r", "enter", "escape"].includes(key)) event.preventDefault();
        if (gameState === "title" && (key === "arrowleft" || key === "arrowright")) {
          selectedOpponentIndex = (selectedOpponentIndex + (key === "arrowright" ? 1 : -1) + opponentOptions.length) % opponentOptions.length;
          return;
        }
        if (key === "enter" && gameState === "title") {
          configureOpponent(opponentOptions[selectedOpponentIndex]);
          gameState = "combat";
          resetRound();
          return;
        }
        if (key === "escape") {
          gameState = "title";
          gameOver = false;
          keys.clear();
          statusMessage.classList.remove("visible");
          return;
        }
        keys.add(key);
        if (key === "r" && gameOver) {
          round += 1;
          resetRound();
        }
      }

      function handleKeyUp(event) {
        keys.delete(event.key.toLowerCase());
      }

      window.addEventListener("keydown", handleKeyDown);
      window.addEventListener("keyup", handleKeyUp);

      function update(delta) {
        const dt = Math.min(delta / 16.67, 2);
        if (gameState === "title") {
          updateParticles(dt);
          return;
        }
        if (gameOver) {
          updateParticles(dt);
          return;
        }

        if (superMove.active) {
          updateUltimate(dt);
          updateParticles(dt);
          return;
        }

        updatePlayer(dt);
        updateBot(dt);
        updateFighter(player, dt);
        updateFighter(bot, dt);
        updateProjectiles(dt);
        updateParticles(dt);

        endRoundIfNeeded();
      }

      function updatePlayer(dt) {
        if (player.hurtTimer > 0) return;
        if (!keys.has("arrowdown") && !keys.has("a")) superMove.inputLock = false;
        if (keys.has("arrowdown") && keys.has("a") && !superMove.inputLock && player.health <= 30) {
          startUltimate();
          return;
        }
        const left = keys.has("arrowleft");
        const right = keys.has("arrowright");
        player.vx = (right ? 3.5 : 0) + (left ? -3.5 : 0);
        if (player.vx !== 0) player.facing = Math.sign(player.vx);
        if (keys.has("arrowup") && player.grounded && !player.jumpLock) {
          player.vy = -11;
          player.grounded = false;
          player.jumpLock = true;
          burst(player.x, player.y, COLORS.mid, 5);
        }
        if (!keys.has("arrowup")) player.jumpLock = false;
        if (keys.has("a") && player.attackCooldown <= 0) castSpell(player);
      }

      function startUltimate() {
        superMove.active = true;
        superMove.timer = 0;
        superMove.damageApplied = false;
        superMove.inputLock = true;
        player.vx = 0;
        player.vy = 0;
        player.attackTimer = 18;
        player.attackCooldown = 999;
        bot.vx = 0;
        bot.vy = 0;
        bot.attackTimer = 0;
        burst(player.x + player.facing * 28, player.y - 58, COLORS.green, 18);
        screenShake = 2;
      }

      function updateUltimate(dt) {
        superMove.timer += dt;
        const timer = superMove.timer;
        screenShake = timer < 14 ? 3 : timer < 43 ? 1 : timer < 57 ? 5 : timer < 65 ? 7 : 2;
        if (timer >= 14 && timer - dt < 14) {
          burst(player.x, WORLD.floor - 6, COLORS.mid, 24);
          burst(player.x, WORLD.floor - 6, COLORS.glow, 12);
        }
        if (timer >= 29 && timer < 43 && Math.random() > 0.35) {
          burst(player.x + (Math.random() - 0.5) * 70, player.y - 58, COLORS.white, 3);
        }
        if (timer >= 43 && !superMove.damageApplied) {
          superMove.damageApplied = true;
          bot.health = Math.max(0, bot.health - 55);
          bot.hurtTimer = 26;
          bot.flashTimer = 26;
          bot.vx = player.facing * 13;
          bot.vy = -8;
          burst(bot.x, bot.y - 50, COLORS.white, 30);
          burst(bot.x, bot.y - 50, bot.color, 24);
        }
        if (timer >= 43 && timer < 58 && Math.random() > 0.25) {
          burst(Math.random() * WORLD.width, player.y - 50 + (Math.random() - 0.5) * 80, COLORS.glow, 2);
        }
        if (timer >= 72) {
          superMove.active = false;
          player.attackCooldown = 34;
          screenShake = 0;
          endRoundIfNeeded();
        }
      }

      function endRoundIfNeeded() {
        if (player.health <= 0 || bot.health <= 0) {
          gameOver = true;
          const playerWon = bot.health <= 0;
          statusMessage.innerHTML = `${playerWon ? "SHANDALF WINS" : `${bot.name} WINS`}<br><small>Press R to rematch</small>`;
          statusMessage.classList.add("visible");
          burst(playerWon ? bot.x : player.x, WORLD.floor - 52, playerWon ? COLORS.glow : COLORS.mid, 18);
        }
      }

      function updateBot(dt) {
        if (bot.hurtTimer > 0) return;
        botThink -= dt;
        const distance = player.x - bot.x;
        bot.facing = distance >= 0 ? 1 : -1;
        bot.vx = Math.abs(distance) > 112 ? bot.facing * bot.speed : 0;
        if (bot.grounded && Math.abs(distance) < 170 && botThink <= 0) {
          botThink = 70 + Math.random() * 55;
          if (Math.random() > 0.35) bot.vy = -9.5;
        }
        if (Math.abs(distance) < 150 && bot.attackCooldown <= 0 && Math.random() > 0.5) {
          bot.attackTimer = 13;
          bot.attackCooldown = 52;
        }
      }

      function updateFighter(fighter, dt) {
        fighter.attackCooldown = Math.max(0, fighter.attackCooldown - dt);
        fighter.attackTimer = Math.max(0, fighter.attackTimer - dt);
        if (fighter.attackTimer === 0) fighter.hitRegistered = false;
        fighter.hurtTimer = Math.max(0, fighter.hurtTimer - dt);
        fighter.flashTimer = Math.max(0, fighter.flashTimer - dt);
        fighter.vy += 0.55 * dt;
        fighter.x += fighter.vx * dt;
        fighter.y += fighter.vy * dt;
        fighter.vx *= Math.pow(0.72, dt);
        fighter.walkCycle += Math.abs(fighter.vx) * dt;
        if (fighter.y >= WORLD.floor) {
          fighter.y = WORLD.floor;
          fighter.vy = 0;
          fighter.grounded = true;
        } else {
          fighter.grounded = false;
        }
        fighter.x = Math.max(55, Math.min(WORLD.width - 55, fighter.x));
        if (fighter.isPlayer && fighter.attackTimer > 0) resolveStaffHit(fighter, bot);
        if (!fighter.isPlayer && fighter.attackTimer > 0) resolveStaffHit(fighter, player);
      }

      function castSpell(caster) {
        caster.attackCooldown = 34;
        caster.attackTimer = 10;
        projectiles.push({
          x: caster.x + caster.facing * 32,
          y: caster.y - 56,
          vx: caster.facing * 7,
          radius: 9,
          life: 100,
          owner: caster
        });
        burst(caster.x + caster.facing * 31, caster.y - 56, COLORS.glow, 6);
      }

      function resolveStaffHit(attacker, target) {
        if (attacker.hitRegistered || attacker.attackTimer > 7) return;
        const reach = 72;
        if (Math.abs(target.x - attacker.x) < reach && Math.abs(target.y - attacker.y) < 48) {
          attacker.hitRegistered = true;
          target.health = Math.max(0, target.health - 8);
          target.hurtTimer = 12;
          target.flashTimer = 8;
          target.vx = attacker.facing * 4;
          burst(target.x, target.y - 54, COLORS.glow, 8);
        }
        if (attacker.attackTimer <= 1) attacker.hitRegistered = false;
      }

      function updateProjectiles(dt) {
        projectiles.forEach((spell) => {
          spell.x += spell.vx * dt;
          spell.life -= dt;
          const target = spell.owner === player ? bot : player;
          if (spell.life > 0 && Math.abs(spell.x - target.x) < 34 && Math.abs(spell.y - (target.y - 50)) < 50) {
            target.health = Math.max(0, target.health - 14);
            target.hurtTimer = 16;
            target.flashTimer = 10;
            target.vx = spell.owner.facing * 5;
            burst(spell.x, spell.y, COLORS.glow, 12);
            spell.life = 0;
          }
        });
        projectiles = projectiles.filter((spell) => spell.life > 0 && spell.x > -30 && spell.x < WORLD.width + 30);
      }

      function burst(x, y, color, amount) {
        for (let i = 0; i < amount; i += 1) {
          particles.push({
            x,
            y,
            vx: (Math.random() - 0.5) * 5,
            vy: (Math.random() - 0.65) * 5,
            life: 20 + Math.random() * 20,
            color,
            size: Math.random() > 0.5 ? 4 : 3
          });
        }
      }

      function updateParticles(dt) {
        particles.forEach((particle) => {
          particle.x += particle.vx * dt;
          particle.y += particle.vy * dt;
          particle.vy += 0.14 * dt;
          particle.life -= dt;
        });
        particles = particles.filter((particle) => particle.life > 0);
      }

      function draw() {
        ctx.fillStyle = COLORS.ink;
        ctx.fillRect(0, 0, WORLD.width, WORLD.height);
        if (gameState === "title") {
          drawTitleScreen();
          drawParticles();
          return;
        }
        ctx.save();
        if (screenShake > 0) {
          ctx.translate(Math.round((Math.random() - 0.5) * screenShake * 2), Math.round((Math.random() - 0.5) * screenShake * 2));
        }
        drawBackdrop();
        drawHud();
        drawFighter(player);
        drawFighter(bot);
        drawProjectiles();
        drawParticles();
        drawUltimateEffect();
        ctx.restore();
      }

      function drawUltimateEffect() {
        if (!superMove.active) return;
        const timer = superMove.timer;
        const beamY = player.y - 58;
        ctx.save();
        ctx.imageSmoothingEnabled = false;

        if (timer >= 14 && timer < 43) {
          ctx.fillStyle = "rgba(15, 16, 33, 0.42)";
          ctx.fillRect(0, 0, WORLD.width, WORLD.height);
          ctx.strokeStyle = COLORS.mid;
          ctx.lineWidth = 4;
          ctx.strokeRect(bot.x - 48, bot.y - 96, 96, 100);
          ctx.fillStyle = COLORS.white;
          ctx.font = "bold 11px Courier New, monospace";
          ctx.textAlign = "center";
          ctx.fillText("NO PASSING ZONE", bot.x, bot.y - 106);
          for (let y = bot.y - 92; y < bot.y - 2; y += 12) {
            ctx.fillStyle = y % 24 === 0 ? COLORS.white : COLORS.mid;
            ctx.fillRect(bot.x - 44, y, 5, 5);
            ctx.fillRect(bot.x + 39, y, 5, 5);
          }
        }

        if (timer < 43) {
          const pulse = 12 + Math.floor(timer / 3) % 3 * 4;
          ctx.fillStyle = COLORS.green;
          ctx.fillRect(player.x + player.facing * 24 - pulse / 2, beamY - pulse / 2, pulse, pulse);
          ctx.fillStyle = COLORS.white;
          ctx.fillRect(player.x + player.facing * 24 - 4, beamY - 4, 8, 8);
        }

        if (timer >= 8 && timer < 24) {
          ctx.fillStyle = COLORS.mid;
          ctx.fillRect(player.x - 62, WORLD.floor - 8, 124, 5);
          ctx.fillStyle = COLORS.glow;
          ctx.fillRect(player.x - 34, WORLD.floor - 14, 68, 5);
        }

        if (timer >= 39 && timer < 60) {
          const beamWidth = timer < 43 ? (timer - 39) * 110 : WORLD.width;
          ctx.fillStyle = COLORS.green;
          ctx.fillRect(0, beamY - 25, beamWidth, 50);
          ctx.fillStyle = COLORS.glow;
          ctx.fillRect(0, beamY - 17, beamWidth, 34);
          ctx.fillStyle = COLORS.white;
          ctx.fillRect(0, beamY - 8, beamWidth, 16);
          ctx.fillStyle = COLORS.mid;
          for (let x = 0; x < beamWidth; x += 32) ctx.fillRect(x, beamY - 30 + (x % 3) * 8, 16, 6);
          ctx.fillStyle = COLORS.green;
          for (let x = 12; x < beamWidth; x += 47) ctx.fillRect(x, beamY + 24 - (x % 4) * 5, 9, 9);
        }

        if (timer >= 43 && timer < 66) {
          ctx.fillStyle = COLORS.glow;
          ctx.font = "bold 28px Courier New, monospace";
          ctx.textAlign = "center";
          ctx.fillText("YOU SHALL NOT PASS!", WORLD.width / 2, 170);
          ctx.fillStyle = COLORS.white;
          ctx.font = "bold 13px Courier New, monospace";
          ctx.fillText("PASSED?  NO.", WORLD.width / 2, 198);
        }

        ctx.textAlign = "left";
        ctx.restore();
      }

      function drawTitleScreen() {
        ctx.fillStyle = COLORS.deep;
        ctx.fillRect(0, 0, WORLD.width, WORLD.height);
        ctx.fillStyle = COLORS.ink;
        ctx.fillRect(18, 18, WORLD.width - 36, WORLD.height - 36);
        ctx.strokeStyle = COLORS.mid;
        ctx.lineWidth = 4;
        ctx.strokeRect(30, 30, WORLD.width - 60, WORLD.height - 60);

        ctx.fillStyle = COLORS.deep;
        for (let y = 48; y < 500; y += 24) ctx.fillRect(48, y, 864, 2);
        ctx.fillStyle = COLORS.mid;
        ctx.font = "bold 18px Courier New, monospace";
        ctx.textAlign = "center";
        ctx.fillText("POCKET ARENA // SECTOR 08", WORLD.width / 2, 92);

        ctx.fillStyle = COLORS.glow;
        ctx.font = "bold 44px Courier New, monospace";
        ctx.fillText("SHANDALF:", WORLD.width / 2, 178);
        ctx.font = "bold 36px Courier New, monospace";
        ctx.fillText("HR SHOWDOWN", WORLD.width / 2, 225);
        ctx.fillStyle = COLORS.mid;
        ctx.fillRect(290, 247, 380, 5);

        drawTitleFighter(190, 410, 1, COLORS.glow, COLORS.mid);
        drawTitleFighter(770, 410, -1, COLORS.mid, COLORS.glow);

        const opponent = opponentOptions[selectedOpponentIndex];
        ctx.fillStyle = COLORS.black;
        ctx.fillRect(300, 278, 360, 158);
        ctx.strokeStyle = opponent.color;
        ctx.lineWidth = 4;
        ctx.strokeRect(300, 278, 360, 158);
        ctx.fillStyle = COLORS.white;
        ctx.font = "bold 13px Courier New, monospace";
        ctx.fillText("SELECT RIVAL", WORLD.width / 2, 300);
        ctx.fillStyle = opponent.color;
        ctx.font = "bold 22px Courier New, monospace";
        ctx.fillText("<", 322, 370);
        ctx.fillText(">", 638, 370);
        ctx.font = "bold 16px Courier New, monospace";
        ctx.fillText(opponent.name, WORLD.width / 2, 326);
        drawTitleOpponent(opponent, WORLD.width / 2, 390);
        ctx.fillStyle = opponent.color;
        ctx.fillRect(450, 420, 60, 6);
        ctx.fillStyle = COLORS.mid;
        ctx.font = "10px Courier New, monospace";
        ctx.fillText("LEFT / RIGHT TO CHOOSE", WORLD.width / 2, 450);

        ctx.fillStyle = COLORS.glow;
        ctx.font = "bold 13px Courier New, monospace";
        ctx.fillText("ARROW KEYS: MOVE/JUMP  |  A: ATTACK  |  S: SHIELD", WORLD.width / 2, 474);
        ctx.fillStyle = COLORS.green;
        ctx.font = "bold 10px Courier New, monospace";
        ctx.fillText("DOWN + A: YOU SHALL NOT PASS!  (UNDER 30% HP)", WORLD.width / 2, 492);
        if (Math.floor(performance.now() / 450) % 2 === 0) {
          ctx.fillStyle = COLORS.glow;
          ctx.font = "bold 18px Courier New, monospace";
          ctx.fillText("PRESS ENTER TO START", WORLD.width / 2, 510);
        }
        ctx.textAlign = "left";
      }

      function drawTitleFighter(x, y, facing, primary, secondary) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(facing, 1);
        ctx.fillStyle = secondary;
        ctx.fillRect(-22, -68, 44, 8);
        ctx.fillRect(-18, -60, 36, 29);
        ctx.fillRect(-21, -28, 42, 12);
        ctx.fillRect(-16, -16, 32, 15);
        ctx.fillStyle = primary;
        ctx.fillRect(-13, -52, 26, 8);
        ctx.fillRect(-14, -1, 10, 27);
        ctx.fillRect(5, -1, 10, 27);
        ctx.fillStyle = COLORS.ink;
        ctx.fillRect(-12, -51, 6, 6);
        ctx.fillRect(6, -51, 6, 6);
        ctx.fillRect(-19, 25, 15, 5);
        ctx.fillRect(4, 25, 15, 5);
        ctx.fillStyle = primary;
        ctx.fillRect(27, -62, 5, 62);
        ctx.fillRect(24, -67, 11, 5);
        ctx.restore();
      }

      function drawTitleOpponent(opponent, x, y) {
        if (opponent.sprite && opponent.sprite.complete) {
          ctx.drawImage(opponent.sprite, x - 42, y - 48, 84, 96);
          return;
        }
        drawTitleFighter(x, y, 1, opponent.color, opponent.accent);
      }

      function drawBackdrop() {
        ctx.fillStyle = COLORS.ink;
        ctx.fillRect(0, 0, WORLD.width, WORLD.floor);

        // Layered skyline blocks keep the arena bright without losing its depth.
        ctx.fillStyle = COLORS.black;
        ctx.fillRect(0, 270, WORLD.width, WORLD.floor - 270);
        ctx.fillStyle = COLORS.deep;
        for (let x = 0; x < WORLD.width; x += 96) {
          const height = 55 + ((x / 96) % 4) * 18;
          ctx.fillRect(x, WORLD.floor - height, 72, height);
          ctx.fillRect(x + 12, WORLD.floor - height - 10, 48, 10);
        }
        ctx.fillStyle = COLORS.purple;
        for (let x = 18; x < WORLD.width; x += 48) {
          const height = 25 + ((x / 48) % 3) * 12;
          ctx.fillRect(x, WORLD.floor - height, 24, height);
        }
        ctx.fillStyle = COLORS.glow;
        for (let x = 12; x < WORLD.width; x += 48) {
          for (let y = WORLD.floor - 76; y < WORLD.floor - 8; y += 17) {
            if ((x + y) % 3 !== 0) ctx.fillRect(x, y, 6, 5);
          }
        }
        ctx.fillStyle = COLORS.mid;
        ctx.fillRect(0, 244, WORLD.width, 4);
        ctx.fillRect(62, 192, 5, 52);
        ctx.fillRect(893, 192, 5, 52);
        ctx.fillRect(48, 184, 33, 8);
        ctx.fillRect(879, 184, 33, 8);

        ctx.fillStyle = COLORS.deep;
        ctx.fillRect(0, WORLD.floor, WORLD.width, WORLD.height - WORLD.floor);
        ctx.fillStyle = COLORS.glow;
        ctx.fillRect(0, WORLD.floor, WORLD.width, 4);
        ctx.fillStyle = COLORS.mid;
        for (let x = 0; x < WORLD.width; x += 48) ctx.fillRect(x, WORLD.floor + 25, 3, 52);
        for (let y = WORLD.floor + 25; y < WORLD.height; y += 26) ctx.fillRect(0, y, WORLD.width, 3);
        ctx.fillStyle = COLORS.purple;
        ctx.fillRect(0, WORLD.floor + 8, WORLD.width, 8);

        ctx.fillStyle = COLORS.white;
        ctx.font = "10px Courier New, monospace";
        ctx.fillText("ARC-08", 20, 32);
        ctx.fillText("MAGIC / MACHINE", 770, 32);
        ctx.fillStyle = COLORS.mid;
        ctx.fillRect(420, 80, 120, 4);
        ctx.fillRect(447, 91, 66, 4);
      }

      function drawHud() {
        drawHealthBar(38, 49, 330, player.health, player.name, true);
        drawHealthBar(592, 49, 330, bot.health, bot.name, false, bot.maxHealth, bot.color);
        drawOpponentAvatar(bot);
        ctx.fillStyle = COLORS.mid;
        ctx.font = "bold 16px Courier New, monospace";
        ctx.textAlign = "center";
        ctx.fillText("VS", WORLD.width / 2, 76);
        ctx.textAlign = "left";
      }

      function drawHealthBar(x, y, width, health, label, isPlayer, maxHealth = 100, barColor = COLORS.mid) {
        ctx.fillStyle = barColor;
        ctx.font = "bold 12px Courier New, monospace";
        ctx.textAlign = isPlayer ? "left" : "right";
        ctx.fillText(label, isPlayer ? x : x + width, y - 10);
        ctx.fillStyle = COLORS.deep;
        ctx.fillRect(x, y, width, 22);
        ctx.fillStyle = health > maxHealth * 0.35 ? barColor : COLORS.red;
        const fillWidth = Math.max(0, width * health / maxHealth);
        ctx.fillRect(isPlayer ? x : x + width - fillWidth, y, fillWidth, 22);
        ctx.strokeStyle = barColor;
        ctx.lineWidth = 3;
        ctx.strokeRect(x, y, width, 22);
        ctx.fillStyle = COLORS.ink;
        ctx.font = "bold 11px Courier New, monospace";
        ctx.textAlign = isPlayer ? "left" : "right";
        ctx.fillText(`${Math.ceil(health)} HP`, isPlayer ? x + 8 : x + width - 8, y + 15);
        ctx.textAlign = "left";
      }

      function drawOpponentAvatar(fighter) {
        ctx.fillStyle = COLORS.black;
        ctx.fillRect(548, 42, 34, 38);
        ctx.strokeStyle = fighter.color;
        ctx.lineWidth = 3;
        ctx.strokeRect(548, 42, 34, 38);
        if (fighter.sprite && fighter.sprite.complete) {
          ctx.drawImage(fighter.sprite, 551, 44, 28, 33);
        } else {
          ctx.save();
          ctx.translate(565, 75);
          ctx.scale(0.38, 0.38);
          drawBotBody(fighter.color, fighter.accent, 0);
          ctx.restore();
        }
      }

      function drawFighter(fighter) {
        const x = Math.round(fighter.x);
        const y = Math.round(fighter.y);
        const moving = Math.abs(fighter.vx) > 0.4 && fighter.grounded;
        const step = moving ? (Math.floor(fighter.walkCycle / 5) % 2) * 5 : 0;
        const primary = fighter.flashTimer > 0 ? COLORS.glow : fighter.color;
        const secondary = fighter.flashTimer > 0 ? COLORS.mid : fighter.accent;
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(fighter.facing, 1);
        ctx.imageSmoothingEnabled = false;

        ctx.fillStyle = COLORS.black;
        ctx.fillRect(-27, -2, 54, 7);
        ctx.fillRect(-17, 5, 34, 5);

        if (fighter.isPlayer) drawWizardBody(primary, secondary, step);
        else if (fighter.sprite && fighter.sprite.complete) ctx.drawImage(fighter.sprite, -40, -84, 80, 84);
        else drawBotBody(primary, secondary, step);

        if (fighter.attackTimer > 0) {
          ctx.fillStyle = COLORS.glow;
          ctx.fillRect(17, -61, 5, 55);
          ctx.fillRect(22, -64, 5, 7);
          ctx.fillRect(27, -61, 5, 5);
        }
        ctx.restore();
      }

      function drawWizardBody(primary, secondary, step) {
        ctx.fillStyle = COLORS.blueDark;
        ctx.fillRect(-18, -38, 36, 8);
        ctx.fillStyle = COLORS.white;
        ctx.fillRect(-15, -30, 30, 17);
        ctx.fillRect(-11, -13, 22, 12);
        ctx.fillStyle = COLORS.gold;
        ctx.fillRect(-13, -28, 10, 5);
        ctx.fillRect(3, -28, 10, 5);
        ctx.fillRect(-3, -27, 6, 3);
        ctx.fillStyle = COLORS.blueDark;
        ctx.fillRect(-21, -3, 42, 11);
        ctx.fillRect(-17, 8, 34, 12);
        ctx.fillStyle = COLORS.mid;
        ctx.fillRect(-14, 20, 10, 19 + step);
        ctx.fillRect(5, 20, 10, 19 - step);
        ctx.fillStyle = COLORS.black;
        ctx.fillRect(-19, 39 + step, 15, 5);
        ctx.fillRect(4, 39 - step, 15, 5);
        ctx.fillStyle = COLORS.blueDark;
        ctx.fillRect(18, 4, 10, 7);
        ctx.fillRect(-29, 4, 10, 7);
        ctx.fillStyle = COLORS.gold;
        ctx.fillRect(28, -49, 4, 48);
        ctx.fillRect(25, -52, 10, 5);
        ctx.fillStyle = COLORS.green;
        ctx.fillRect(24, -60, 12, 8);
        ctx.fillRect(27, -63, 6, 3);
        ctx.fillStyle = COLORS.white;
        ctx.fillRect(-10, -13, 20, 5);
      }

      function drawBotBody(primary, secondary, step) {
        ctx.fillStyle = COLORS.blueDark;
        ctx.fillRect(-20, -3, 40, 14);
        ctx.fillRect(-16, 11, 32, 13);
        ctx.fillStyle = COLORS.mid;
        ctx.fillRect(-15, 24, 10, 16 + step);
        ctx.fillRect(5, 24, 10, 16 - step);
        ctx.fillStyle = COLORS.black;
        ctx.fillRect(-19, 40 + step, 15, 5);
        ctx.fillRect(4, 40 - step, 15, 5);
        ctx.fillStyle = COLORS.blueDark;
        ctx.fillRect(19, 1, 13, 9);
        ctx.fillRect(-32, 1, 13, 9);
        ctx.fillStyle = COLORS.black;
        ctx.fillRect(-18, -38, 36, 8);
        ctx.fillRect(-13, -30, 26, 20);
        ctx.fillStyle = COLORS.red;
        ctx.fillRect(-10, -25, 20, 6);
        ctx.fillStyle = COLORS.glow;
        ctx.fillRect(-6, -24, 4, 3);
        ctx.fillRect(3, -24, 4, 3);
        ctx.fillStyle = COLORS.white;
        ctx.fillRect(-5, 0, 10, 4);
      }

      function drawProjectiles() {
        projectiles.forEach((spell) => {
          ctx.fillStyle = COLORS.mid;
          ctx.fillRect(Math.round(spell.x - 12), Math.round(spell.y - 4), 24, 8);
          ctx.fillStyle = COLORS.glow;
          ctx.fillRect(Math.round(spell.x - 7), Math.round(spell.y - 9), 14, 18);
          ctx.fillStyle = COLORS.ink;
          ctx.fillRect(Math.round(spell.x - 3), Math.round(spell.y - 3), 6, 6);
        });
      }

      function drawParticles() {
        particles.forEach((particle) => {
          ctx.fillStyle = particle.color;
          ctx.fillRect(Math.round(particle.x), Math.round(particle.y), particle.size, particle.size);
        });
      }

      function loop(now) {
        update(now - lastTime);
        draw();
        lastTime = now;
        requestAnimationFrame(loop);
      }

      resetRound();
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
