<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shandalf vs Rippling Bot</title>
  <style>
    :root {
      --ink: #1d2b53;
      --deep: #7e2553;
      --mid: #29adff;
      --glow: #ffcc00;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--ink);
      color: var(--glow);
      font-family: "Courier New", Courier, monospace;
    }

    body {
      display: grid;
      place-items: center;
      padding: 24px;
      overflow-x: hidden;
    }

    main {
      width: min(100%, 1120px);
    }

    .masthead {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 14px;
      text-transform: uppercase;
    }

    .eyebrow {
      margin: 0 0 5px;
      color: var(--mid);
      font-size: clamp(10px, 1.5vw, 13px);
      letter-spacing: 3px;
    }

    h1 {
      margin: 0;
      color: var(--glow);
      font-size: clamp(22px, 4vw, 40px);
      letter-spacing: 2px;
      line-height: 1;
      text-shadow: 3px 3px var(--deep);
    }

    .round-label {
      padding: 8px 10px;
      border: 2px solid var(--deep);
      color: var(--mid);
      font-size: 11px;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    .cabinet {
      border: 4px solid var(--deep);
      background: var(--deep);
      box-shadow: 0 0 0 4px var(--ink), 0 0 0 7px var(--deep);
    }

    .screen-wrap {
      position: relative;
      background: var(--ink);
      aspect-ratio: 16 / 9;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .status {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
    }

    .status-message {
      display: none;
      padding: 13px 18px;
      border: 3px solid var(--glow);
      background: var(--ink);
      color: var(--glow);
      text-align: center;
      text-transform: uppercase;
      font-size: clamp(12px, 2vw, 18px);
      line-height: 1.45;
      letter-spacing: 2px;
      box-shadow: 6px 6px 0 var(--deep);
    }

    .status-message.visible { display: block; }

    .controls {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 18px;
      padding: 13px 16px;
      border-top: 4px solid var(--deep);
      background: var(--ink);
    }

    .key-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      color: var(--mid);
      font-size: 11px;
      line-height: 1.5;
      text-transform: uppercase;
    }

    .key-list span { white-space: nowrap; }

    kbd {
      display: inline-block;
      min-width: 23px;
      margin-right: 4px;
      padding: 3px 5px;
      border: 2px solid var(--mid);
      color: var(--glow);
      text-align: center;
      font-weight: 700;
    }

    .tip {
      color: var(--mid);
      font-size: 10px;
      letter-spacing: 1px;
      text-align: right;
      text-transform: uppercase;
    }

    @media (max-width: 640px) {
      body { padding: 13px; }
      .masthead { align-items: start; flex-direction: column; gap: 10px; }
      .round-label { align-self: stretch; text-align: center; }
      .controls { grid-template-columns: 1fr; }
      .tip { text-align: left; }
      .key-list { gap: 8px 10px; }
    }
  </style>
</head>
<body>
  <main>
    <header class="masthead">
      <div>
        <p class="eyebrow">Pocket Arena // Sector 08</p>
        <h1>Shandalf Showdown</h1>
      </div>
      <div class="round-label">Round <span id="roundNumber">01</span> // Live</div>
    </header>

    <section class="cabinet" aria-label="Shandalf versus Rippling Bot game">
      <div class="screen-wrap">
        <canvas id="game" width="960" height="540" aria-label="Arcade fighting game canvas"></canvas>
        <div class="status"><div id="statusMessage" class="status-message"></div></div>
      </div>
      <div class="controls">
        <div class="key-list">
          <span><kbd>←</kbd><kbd>→</kbd> Move</span>
          <span><kbd>↑</kbd> Jump</span>
          <span><kbd>A</kbd> Magic</span>
          <span><kbd>Z</kbd> Punch</span>
          <span><kbd>X</kbd> Kick</span>
          <span><kbd>S</kbd> Shield</span>
        </div>
        <div class="tip">Land the spell. Keep your distance.</div>
      </div>
    </section>
  </main>

  <script>
    (() => {
      "use strict";

      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const statusMessage = document.getElementById("statusMessage");
      const roundNumber = document.getElementById("roundNumber");

      const COLORS = {
        ink: "#1D2B53",
        deep: "#7E2553",
        mid: "#29ADFF",
        glow: "#FFCC00",
        gold: "#FFCC00",
        white: "#FFF1E8",
        green: "#00E436",
        red: "#FF004D",
        blueDark: "#1D5B8F",
        purple: "#AB3472",
        black: "#0F1021",
        arenaLight: "#BEC6CF"
      };
      const WORLD = { width: 960, height: 540, floor: 442 };
      const keys = new Set();
      let projectiles = [];
      let particles = [];
      let round = 1;
      let gameState = "STAGE_SELECT";
      let gameOver = false;
      let matchWinner = null;
      let playerRoundWins = 0;
      let botRoundWins = 0;
      let arrSecured = 0;
      let winStreak = 0;
      let roundTransitionActive = false;
      let roundTransitionTimer = 0;
      let roundBannerTimer = 0;
      let koBannerTimer = 0;
      let lastTime = performance.now();
      let botThink = 0;
      let selectedOpponentIndex = 0;
      let selectedStageIndex = 0;
      let currentStageId = "server_room";
      let chosenOpponent = null;
      let audioContext = null;
      let availableVoices = [];
      let screenShake = 0;
      const superMove = {
        active: false,
        timer: 0,
        damageApplied: false,
        inputLock: false,
        speechTimer: 0
      };

      function createSpriteImage(svg) {
        const image = new Image();
        image.src = `data:image/svg+xml,${encodeURIComponent(svg)}`;
        return image;
      }

      const opponentOptions = [
        {
          name: "RIPPLING BOT",
          color: COLORS.red,
          accent: COLORS.mid,
          speed: 1.35,
          health: 80,
          sprite: null
        },
        {
          name: "FACTORIAL MECH",
          color: "#FFA300",
          accent: COLORS.ink,
          speed: 0.8,
          health: 130,
          sprite: createSpriteImage(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 90" shape-rendering="crispEdges"><path fill="#FFA300" d="M22 2h36v8h8v12h6v28H60v30H48v8H32v-8H20V50H8V22h6V10h8z"/><path fill="#1D2B53" d="M14 22h52v28H14zM20 58h40v22H20z"/><path fill="#FFCC00" d="M26 30h28v8H26zM31 60h18v12H31z"/><path fill="#1D2B53" d="M29 12h8v8h-8zM43 12h8v8h-8zM8 34h10v10H8zM62 34h10v10H62z"/></svg>`)
        },
        {
          name: "HIBOB CYBORG",
          color: "#FF77A8",
          accent: COLORS.ink,
          speed: 1.1,
          health: 100,
          sprite: createSpriteImage(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 90" shape-rendering="crispEdges"><path fill="#FF77A8" d="M20 2h40v8h8v12h6v30H60v28H48v8H32v-8H20V52H6V22h6V10h8z"/><path fill="#1D2B53" d="M14 22h52v30H14zM20 58h40v22H20z"/><path fill="#FF004D" d="M24 30h32v8H24zM31 60h18v12H31z"/><path fill="#1D2B53" d="M29 12h8v8h-8zM43 12h8v8h-8zM6 36h12v10H6zM62 36h12v10H62z"/></svg>`)
        }
      ];

      const stages = [
        {
          id: "server_room",
          name: "SERVER ROOM DUNGEON",
          tagline: "The prod server has a wizard problem.",
          accent: COLORS.green
        },
        {
          id: "office",
          name: "OPEN-PLAN OFFICE",
          tagline: "Mordor is booked until Q4.",
          accent: COLORS.glow
        },
        {
          id: "cloud",
          name: "CLOUD INFRASTRUCTURE",
          tagline: "There is no cloud, only someone else's dungeon.",
          accent: COLORS.mid
        },
        {
          id: "slack",
          name: "SLACK // #GENERAL",
          tagline: "Who broke build? Asking for a channel.",
          accent: COLORS.purple
        }
      ];

      const player = createFighter({
        name: "SHANDALF",
        x: 220,
        color: COLORS.glow,
        accent: COLORS.mid,
        facing: 1,
        isPlayer: true
      });
      const bot = createFighter({
        ...opponentOptions[0],
        x: 740,
        facing: -1,
        isPlayer: false
      });
      chosenOpponent = opponentOptions[0];

      function createFighter(options) {
        return {
          ...options,
          y: WORLD.floor,
          vx: 0,
          vy: 0,
          width: 54,
          height: 88,
          health: options.health || 100,
          maxHealth: options.health || 100,
          grounded: true,
          attackCooldown: 0,
          attackTimer: 0,
          hurtTimer: 0,
          flashTimer: 0,
          walkCycle: 0,
          jumpLock: false
          ,meleeTimer: 0
          ,meleeCooldown: 0
          ,meleeHitRegistered: false
          ,meleeType: "punch"
          ,shielding: false
        };
      }

      function configureOpponent(opponent) {
        chosenOpponent = opponent;
        bot.name = opponent.name;
        bot.color = opponent.color;
        bot.accent = opponent.accent;
        bot.speed = opponent.speed;
        bot.maxHealth = opponent.health;
        bot.health = opponent.health;
        bot.sprite = opponent.sprite;
      }

      function resetRound() {
        player.x = 220;
        player.y = WORLD.floor;
        player.vx = 0;
        player.vy = 0;
        player.health = 100;
        player.grounded = true;
        player.attackCooldown = 0;
        player.attackTimer = 0;
        player.hurtTimer = 0;
        player.meleeTimer = 0;
        player.meleeCooldown = 0;
        player.meleeHitRegistered = false;
        player.shielding = false;
        bot.x = 740;
        bot.y = WORLD.floor;
        bot.vx = 0;
        bot.vy = 0;
        bot.health = bot.maxHealth;
        bot.grounded = true;
        bot.attackCooldown = 0;
        bot.attackTimer = 0;
        bot.hurtTimer = 0;
        bot.meleeTimer = 0;
        bot.meleeCooldown = 0;
        bot.meleeHitRegistered = false;
        bot.shielding = false;
        superMove.active = false;
        superMove.timer = 0;
        superMove.damageApplied = false;
        superMove.inputLock = false;
        superMove.speechTimer = 0;
        screenShake = 0;
        roundTransitionActive = false;
        roundTransitionTimer = 0;
        roundBannerTimer = 120;
        koBannerTimer = 0;
        projectiles = [];
        particles = [];
        gameOver = false;
        statusMessage.classList.remove("visible");
        roundNumber.textContent = String(round).padStart(2, "0");
      }

      function beginMatch() {
        playerRoundWins = 0;
        botRoundWins = 0;
        round = 1;
        matchWinner = null;
        configureOpponent(opponentOptions[selectedOpponentIndex]);
        gameState = "combat";
        resetRound();
        announceFight();
      }

      function handleKeyDown(event) {
        const key = event.key.toLowerCase();
        if (["arrowleft", "arrowright", "arrowup", "arrowdown", "a", "d", "s", "x", "z", "r", "enter", " ", "escape"].includes(key)) event.preventDefault();
        if (gameState === "STAGE_SELECT" && ["arrowleft", "arrowright", "a", "d"].includes(key)) {
          const movesRight = key === "arrowright" || key === "d";
          selectedStageIndex = (selectedStageIndex + (movesRight ? 1 : -1) + stages.length) % stages.length;
          return;
        }
        if (gameState === "STAGE_SELECT" && (key === "enter" || key === " ")) {
          unlockAudio();
          currentStageId = stages[selectedStageIndex].id;
          gameState = "title";
          return;
        }
        if (gameState === "title" && (key === "arrowleft" || key === "arrowright")) {
          selectedOpponentIndex = (selectedOpponentIndex + (key === "arrowright" ? 1 : -1) + opponentOptions.length) % opponentOptions.length;
          return;
        }
        if (key === "enter" && gameState === "title") {
          beginMatch();
          return;
        }
        if (key === "enter" && gameOver) {
          if (matchWinner === "player") {
            selectedOpponentIndex = (selectedOpponentIndex + 1) % opponentOptions.length;
          }
          gameState = "title";
          gameOver = false;
          statusMessage.classList.remove("visible");
          return;
        }
        if (key === "escape") {
          gameState = "STAGE_SELECT";
          gameOver = false;
          keys.clear();
          statusMessage.classList.remove("visible");
          return;
        }
        if (key === "s" && gameState === "combat" && !keys.has("s")) playShieldSound();
        keys.add(key);
        if (key === "r" && gameOver) {
          gameState = "STAGE_SELECT";
          gameOver = false;
          statusMessage.classList.remove("visible");
        }
      }

      function handleKeyUp(event) {
        keys.delete(event.key.toLowerCase());
      }

      window.addEventListener("keydown", handleKeyDown);
      window.addEventListener("keyup", handleKeyUp);
      canvas.addEventListener("pointerdown", unlockAudio);

      function unlockAudio() {
        if (!("AudioContext" in window || "webkitAudioContext" in window)) return null;
        if (!audioContext) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          audioContext = new AudioContextClass();
        }
        if (audioContext.state === "suspended") audioContext.resume();
        return audioContext;
      }

      function refreshSpeechVoices() {
        if ("speechSynthesis" in window) availableVoices = window.speechSynthesis.getVoices();
      }

      if ("speechSynthesis" in window) {
        refreshSpeechVoices();
        window.speechSynthesis.addEventListener("voiceschanged", refreshSpeechVoices);
      }

      function tone(frequency, duration, type = "square", volume = 0.045, endFrequency = frequency, delay = 0) {
        const context = unlockAudio();
        if (!context) return;
        const start = context.currentTime + delay;
        const oscillator = context.createOscillator();
        const gain = context.createGain();
        oscillator.type = type;
        oscillator.frequency.setValueAtTime(frequency, start);
        oscillator.frequency.exponentialRampToValueAtTime(Math.max(20, endFrequency), start + duration);
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime(volume, start + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
        oscillator.connect(gain);
        gain.connect(context.destination);
        oscillator.start(start);
        oscillator.stop(start + duration + 0.02);
      }

      function noiseBurst(duration = 0.12, volume = 0.08) {
        const context = unlockAudio();
        if (!context) return;
        const buffer = context.createBuffer(1, context.sampleRate * duration, context.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < data.length; i += 1) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
        const source = context.createBufferSource();
        const filter = context.createBiquadFilter();
        const gain = context.createGain();
        source.buffer = buffer;
        filter.type = "bandpass";
        filter.frequency.value = 900;
        filter.Q.value = 1.2;
        gain.gain.value = volume;
        source.connect(filter);
        filter.connect(gain);
        gain.connect(context.destination);
        source.start();
      }

      function announceFight() {
        unlockAudio();
        tone(392, 0.16, "square", 0.06, 523, 0);
        tone(523, 0.16, "square", 0.06, 659, 0.14);
        tone(659, 0.28, "square", 0.07, 784, 0.28);
        speakWizardLine("Fight!", true);
      }

      function chooseWizardVoice() {
        const voices = availableVoices.length ? availableVoices : window.speechSynthesis.getVoices();
        return voices.find((voice) => /male|bass|baritone|deep|uk english male/i.test(`${voice.name} ${voice.lang}`))
          || voices.find((voice) => /^en-GB/i.test(voice.lang))
          || voices.find((voice) => /^en/i.test(voice.lang))
          || null;
      }

      function speakWizardLine(text, impact = false) {
        if (!("speechSynthesis" in window) || !("SpeechSynthesisUtterance" in window)) return;
        window.speechSynthesis.cancel();
        const line = new SpeechSynthesisUtterance(text);
        line.rate = 0.85;
        line.pitch = 0.3;
        line.volume = 1;
        const voice = chooseWizardVoice();
        if (voice) line.voice = voice;
        if (impact) playVoiceImpact();
        window.speechSynthesis.speak(line);
      }

      function playVoiceImpact() {
        const context = unlockAudio();
        if (!context) return;
        const start = context.currentTime;
        const oscillator = context.createOscillator();
        const envelope = context.createGain();
        const lowPass = context.createBiquadFilter();
        const delay = context.createDelay(0.4);
        const feedback = context.createGain();
        const echoGain = context.createGain();
        oscillator.type = "sine";
        oscillator.frequency.setValueAtTime(60, start);
        envelope.gain.setValueAtTime(0.0001, start);
        envelope.gain.exponentialRampToValueAtTime(0.22, start + 0.025);
        envelope.gain.exponentialRampToValueAtTime(0.0001, start + 0.85);
        lowPass.type = "lowpass";
        lowPass.frequency.setValueAtTime(180, start);
        lowPass.Q.value = 0.8;
        delay.delayTime.value = 0.18;
        feedback.gain.value = 0.2;
        echoGain.gain.value = 0.24;
        oscillator.connect(envelope);
        envelope.connect(lowPass);
        lowPass.connect(context.destination);
        lowPass.connect(delay);
        delay.connect(echoGain);
        echoGain.connect(context.destination);
        delay.connect(feedback);
        feedback.connect(delay);
        oscillator.start(start);
        oscillator.stop(start + 0.9);
      }

      function playMagicSound() {
        tone(880, 0.18, "sawtooth", 0.045, 180, 0);
      }

      function playMeleeSound() {
        tone(115, 0.09, "triangle", 0.08, 70, 0);
        tone(75, 0.07, "square", 0.035, 45, 0.025);
      }

      function playShieldSound() {
        tone(180, 0.16, "triangle", 0.07, 75, 0);
        tone(420, 0.08, "square", 0.035, 180, 0.02);
      }

      function playJumpSound() {
        tone(240, 0.18, "square", 0.04, 620, 0);
      }

      function playHitSound() {
        noiseBurst(0.11, 0.09);
        tone(110, 0.08, "square", 0.035, 55, 0);
      }

      function playDefeatMelody() {
        tone(440, 0.18, "square", 0.055, 330, 0);
        tone(330, 0.18, "square", 0.05, 247, 0.18);
        tone(247, 0.32, "square", 0.06, 110, 0.36);
      }

      function update(delta) {
        const dt = Math.min(delta / 16.67, 2);
        superMove.speechTimer = Math.max(0, superMove.speechTimer - dt);
        roundBannerTimer = Math.max(0, roundBannerTimer - dt);
        koBannerTimer = Math.max(0, koBannerTimer - dt);
        if (gameState === "STAGE_SELECT") {
          updateParticles(dt);
          return;
        }
        if (gameState === "title") {
          updateParticles(dt);
          return;
        }
        if (gameOver) {
          updateParticles(dt);
          return;
        }

        if (roundTransitionActive) {
          updateRoundTransition(dt);
          updateParticles(dt);
          return;
        }

        if (superMove.active) {
          updateUltimate(dt);
          updateParticles(dt);
          return;
        }

        updatePlayer(dt);
        updateBot(dt);
        updateFighter(player, dt);
        updateFighter(bot, dt);
        updateProjectiles(dt);
        updateParticles(dt);

        endRoundIfNeeded();
      }

      function updatePlayer(dt) {
        if (!keys.has("arrowdown") && !keys.has("a")) superMove.inputLock = false;
        if (keys.has("arrowdown") && keys.has("a") && !superMove.inputLock && player.health <= 30) {
          startUltimate();
          return;
        }
        player.shielding = keys.has("s");
        if (player.shielding) {
          player.vx = 0;
          return;
        }
        if (player.hurtTimer > 0) return;
        const left = keys.has("arrowleft");
        const right = keys.has("arrowright");
        player.vx = (right ? 3.5 : 0) + (left ? -3.5 : 0);
        if (player.vx !== 0) player.facing = Math.sign(player.vx);
        if (keys.has("arrowup") && player.grounded && !player.jumpLock) {
          player.vy = -11;
          player.grounded = false;
          player.jumpLock = true;
          playJumpSound();
          burst(player.x, player.y, COLORS.mid, 5);
        }
        if (!keys.has("arrowup")) player.jumpLock = false;
        if (keys.has("z")) tryMelee(player, "punch");
        if (keys.has("x")) tryMelee(player, "kick");
        if (keys.has("a") && player.attackCooldown <= 0) castSpell(player);
      }

      function tryMelee(fighter, type) {
        if (fighter.meleeCooldown > 0 || fighter.hurtTimer > 0) return;
        fighter.meleeTimer = 6;
        fighter.meleeCooldown = 28;
        fighter.meleeHitRegistered = false;
        fighter.meleeType = type;
        playMeleeSound();
        burst(fighter.x + fighter.facing * 38, fighter.y - 32, COLORS.glow, 4);
      }

      function startUltimate() {
        superMove.active = true;
        superMove.timer = 0;
        superMove.damageApplied = false;
        superMove.inputLock = true;
        superMove.speechTimer = 180;
        player.vx = 0;
        player.vy = 0;
        player.attackTimer = 18;
        player.attackCooldown = 999;
        bot.vx = 0;
        bot.vy = 0;
        bot.attackTimer = 0;
        burst(player.x + player.facing * 28, player.y - 58, COLORS.green, 18);
        screenShake = 2;
        speakUltimateLine();
      }

      function speakUltimateLine() {
        if (!("speechSynthesis" in window) || !("SpeechSynthesisUtterance" in window)) return;
        window.speechSynthesis.cancel();
        const line = new SpeechSynthesisUtterance("You shall not pass!");
        line.rate = 0.72;
        line.pitch = 0.65;
        line.volume = 1;
        const voice = chooseWizardVoice();
        if (voice) line.voice = voice;
        window.speechSynthesis.speak(line);
      }

      function updateUltimate(dt) {
        superMove.timer += dt;
        const timer = superMove.timer;
        screenShake = timer < 14 ? 3 : timer < 43 ? 1 : timer < 57 ? 5 : timer < 65 ? 7 : 2;
        if (timer >= 14 && timer - dt < 14) {
          burst(player.x, WORLD.floor - 6, COLORS.mid, 24);
          burst(player.x, WORLD.floor - 6, COLORS.glow, 12);
        }
        if (timer >= 29 && timer < 43 && Math.random() > 0.35) {
          burst(player.x + (Math.random() - 0.5) * 70, player.y - 58, COLORS.white, 3);
        }
        if (timer >= 43 && !superMove.damageApplied) {
          superMove.damageApplied = true;
          bot.health = Math.max(0, bot.health - 55);
          playHitSound();
          bot.hurtTimer = 26;
          bot.flashTimer = 26;
          bot.vx = player.facing * 13;
          bot.vy = -8;
          burst(bot.x, bot.y - 50, COLORS.white, 30);
          burst(bot.x, bot.y - 50, bot.color, 24);
        }
        if (timer >= 43 && timer < 58 && Math.random() > 0.25) {
          burst(Math.random() * WORLD.width, player.y - 50 + (Math.random() - 0.5) * 80, COLORS.glow, 2);
        }
        if (timer >= 72) {
          superMove.active = false;
          player.attackCooldown = 34;
          screenShake = 0;
          endRoundIfNeeded();
        }
      }

      function updateRoundTransition(dt) {
        roundTransitionTimer = Math.max(0, roundTransitionTimer - dt);
        if (roundTransitionTimer > 0) return;
        if (playerRoundWins >= 2 || botRoundWins >= 2) {
          roundTransitionActive = false;
          finishMatch();
          return;
        }
        round += 1;
        roundTransitionActive = false;
        resetRound();
        announceFight();
      }

      function endRoundIfNeeded() {
        if (roundTransitionActive || gameOver || (player.health > 0 && bot.health > 0)) return;
        const playerWon = bot.health <= 0;
        if (playerWon) {
          playerRoundWins += 1;
          arrSecured += 100000 + Math.ceil(player.health) * 1000;
        } else {
          botRoundWins += 1;
        }
        roundTransitionActive = true;
        roundTransitionTimer = 90;
        koBannerTimer = 90;
        screenShake = 7;
        playDefeatMelody();
        burst(playerWon ? bot.x : player.x, WORLD.floor - 52, playerWon ? COLORS.glow : COLORS.mid, 18);
      }

      function finishMatch() {
        gameOver = true;
        matchWinner = playerRoundWins >= 2 ? "player" : "bot";
        if (matchWinner === "player") {
          winStreak += 1;
          speakWizardLine(`Deal closed! Personio defeats ${bot.name}!`, true);
          statusMessage.innerHTML = `DEAL CLOSED! PERSONIO DEFEATS ${bot.name}! +$200,000 ARR<br><small>PRESS ENTER: NEXT COMPETITOR | PRESS ESC: TITLE SCREEN</small>`;
        } else {
          winStreak = 0;
          statusMessage.innerHTML = `${bot.name} WINS THE MATCH<br><small>PRESS ENTER: NEXT COMPETITOR | PRESS ESC: TITLE SCREEN</small>`;
        }
        statusMessage.classList.add("visible");
      }

      function updateBot(dt) {
        if (bot.hurtTimer > 0) return;
        bot.shielding = false;
        botThink -= dt;
        const distance = player.x - bot.x;
        bot.facing = distance >= 0 ? 1 : -1;
        bot.vx = Math.abs(distance) > 112 ? bot.facing * bot.speed : 0;
        if (bot.grounded && Math.abs(distance) < 170 && botThink <= 0) {
          botThink = 70 + Math.random() * 55;
          if (Math.random() > 0.35) bot.vy = -9.5;
        }
        if (Math.abs(distance) < 150 && bot.attackCooldown <= 0 && Math.random() > 0.5) {
          bot.attackTimer = 13;
          bot.attackCooldown = 52;
        } else if (Math.abs(distance) < 560 && bot.attackCooldown <= 0 && Math.random() > 0.35) {
          castBotBlast(bot);
        }
      }

      function updateFighter(fighter, dt) {
        fighter.attackCooldown = Math.max(0, fighter.attackCooldown - dt);
        fighter.meleeCooldown = Math.max(0, fighter.meleeCooldown - dt);
        fighter.meleeTimer = Math.max(0, fighter.meleeTimer - dt);
        if (fighter.meleeTimer === 0) fighter.meleeHitRegistered = false;
        fighter.attackTimer = Math.max(0, fighter.attackTimer - dt);
        if (fighter.attackTimer === 0) fighter.hitRegistered = false;
        fighter.hurtTimer = Math.max(0, fighter.hurtTimer - dt);
        fighter.flashTimer = Math.max(0, fighter.flashTimer - dt);
        fighter.vy += 0.55 * dt;
        fighter.x += fighter.vx * dt;
        fighter.y += fighter.vy * dt;
        fighter.vx *= Math.pow(0.72, dt);
        fighter.walkCycle += Math.abs(fighter.vx) * dt;
        if (fighter.y >= WORLD.floor) {
          fighter.y = WORLD.floor;
          fighter.vy = 0;
          fighter.grounded = true;
        } else {
          fighter.grounded = false;
        }
        fighter.x = Math.max(55, Math.min(WORLD.width - 55, fighter.x));
        if (fighter.isPlayer && fighter.attackTimer > 0) resolveStaffHit(fighter, bot);
        if (!fighter.isPlayer && fighter.attackTimer > 0) resolveStaffHit(fighter, player);
        if (fighter.isPlayer && fighter.meleeTimer > 0) resolveMeleeHit(fighter, bot);
        if (!fighter.isPlayer && fighter.meleeTimer > 0) resolveMeleeHit(fighter, player);
      }

      function resolveMeleeHit(attacker, target) {
        if (attacker.meleeHitRegistered) return;
        if (Math.abs(target.x - attacker.x) < 50 && Math.abs(target.y - attacker.y) < 48) {
          attacker.meleeHitRegistered = true;
          if (target.shielding) {
            playShieldSound();
            burst(target.x + target.facing * 28, target.y - 44, COLORS.mid, 10);
            return;
          }
          target.health = Math.max(0, target.health - 10);
          target.hurtTimer = 12;
          target.flashTimer = 8;
          target.vx = attacker.facing * 5;
          playHitSound();
          burst(target.x, target.y - 48, COLORS.glow, 6);
        }
      }

      function castSpell(caster) {
        caster.attackCooldown = 34;
        caster.attackTimer = 10;
        playMagicSound();
        projectiles.push({
          x: caster.x + caster.facing * 32,
          y: caster.y - 56,
          vx: caster.facing * 7,
          radius: 9,
          life: 100,
          owner: caster
        });
        burst(caster.x + caster.facing * 31, caster.y - 56, COLORS.glow, 6);
      }

      function castBotBlast(caster) {
        caster.attackCooldown = 70;
        caster.attackTimer = 10;
        projectiles.push({
          x: caster.x + caster.facing * 32,
          y: caster.y - 56,
          vx: caster.facing * 5.5,
          radius: 8,
          life: 110,
          owner: caster,
          damage: 8,
          color: caster.color
        });
        burst(caster.x + caster.facing * 31, caster.y - 56, caster.color, 5);
      }

      function resolveStaffHit(attacker, target) {
        if (attacker.hitRegistered || attacker.attackTimer > 7) return;
        const reach = 72;
        if (Math.abs(target.x - attacker.x) < reach && Math.abs(target.y - attacker.y) < 48) {
          attacker.hitRegistered = true;
          if (target.shielding) {
            playShieldSound();
            burst(target.x + target.facing * 28, target.y - 44, COLORS.mid, 10);
            return;
          }
          target.health = Math.max(0, target.health - 8);
          playHitSound();
          target.hurtTimer = 12;
          target.flashTimer = 8;
          target.vx = attacker.facing * 4;
          burst(target.x, target.y - 54, COLORS.glow, 8);
        }
        if (attacker.attackTimer <= 1) attacker.hitRegistered = false;
      }

      function updateProjectiles(dt) {
        projectiles.forEach((spell) => {
          spell.x += spell.vx * dt;
          spell.life -= dt;
          const target = spell.owner === player ? bot : player;
          if (spell.life > 0 && Math.abs(spell.x - target.x) < 34 && Math.abs(spell.y - (target.y - 50)) < 50) {
            if (target.shielding) {
              burst(spell.x, spell.y, COLORS.mid, 10);
              playShieldSound();
              spell.life = 0;
              return;
            }
            target.health = Math.max(0, target.health - (spell.damage || 14));
            playHitSound();
            target.hurtTimer = 16;
            target.flashTimer = 10;
            target.vx = spell.owner.facing * 5;
            burst(spell.x, spell.y, COLORS.glow, 12);
            spell.life = 0;
          }
        });
        projectiles = projectiles.filter((spell) => spell.life > 0 && spell.x > -30 && spell.x < WORLD.width + 30);
      }

      function burst(x, y, color, amount) {
        for (let i = 0; i < amount; i += 1) {
          particles.push({
            x,
            y,
            vx: (Math.random() - 0.5) * 5,
            vy: (Math.random() - 0.65) * 5,
            life: 20 + Math.random() * 20,
            color,
            size: Math.random() > 0.5 ? 4 : 3
          });
        }
      }

      function updateParticles(dt) {
        particles.forEach((particle) => {
          particle.x += particle.vx * dt;
          particle.y += particle.vy * dt;
          particle.vy += 0.14 * dt;
          particle.life -= dt;
        });
        particles = particles.filter((particle) => particle.life > 0);
      }

      function drawOffice() {
        ctx.fillStyle = COLORS.ink;
        ctx.fillRect(0, 0, WORLD.width, WORLD.floor);
        ctx.fillStyle = COLORS.deep;
        ctx.fillRect(0, 126, WORLD.width, 8);
        ctx.fillRect(110, 134, 8, 200);
        ctx.fillRect(510, 134, 8, 200);
        ctx.fillRect(840, 134, 8, 200);
        ctx.fillStyle = COLORS.arenaLight;
        ctx.fillRect(150, 158, 250, 112);
        ctx.fillRect(570, 158, 210, 112);
        ctx.fillStyle = COLORS.mid;
        ctx.fillRect(150, 158, 250, 5);
        ctx.fillRect(570, 158, 210, 5);
        ctx.fillStyle = COLORS.ink;
        ctx.font = "bold 13px Courier New, monospace";
        ctx.fillText("E = mc²", 184, 205);
        ctx.fillText("Q3 OKRs", 184, 238);
        ctx.fillStyle = COLORS.glow;
        ctx.fillRect(290, 214, 70, 5);
        ctx.fillRect(290, 232, 45, 5);
        ctx.fillStyle = COLORS.deep;
        ctx.fillRect(592, 185, 165, 12);
        ctx.fillRect(592, 218, 130, 12);
        ctx.fillStyle = COLORS.mid;
        for (let x = 80; x < WORLD.width - 80; x += 190) {
          ctx.fillRect(x, 322, 120, 12);
          ctx.fillRect(x + 15, 334, 7, 35);
          ctx.fillRect(x + 98, 334, 7, 35);
        }
        ctx.fillStyle = COLORS.deep;
        ctx.fillRect(425, 360, 58, 40);
        ctx.fillRect(710, 360, 58, 40);
        ctx.fillStyle = COLORS.arenaLight;
        ctx.fillRect(432, 350, 44, 20);
        ctx.fillRect(717, 350, 44, 20);
        ctx.fillStyle = COLORS.glow;
        ctx.font = "10px Courier New, monospace";
        ctx.fillText("Mordor (Booked)", 808, 292);
        ctx.fillStyle = COLORS.mid;
        ctx.fillRect(800, 170, 130, 115);
        ctx.fillStyle = COLORS.ink;
        ctx.fillRect(808, 178, 114, 99);
      }

      function drawCloudInfrastructure() {
        ctx.fillStyle = COLORS.ink;
        ctx.fillRect(0, 0, WORLD.width, WORLD.floor);
        ctx.fillStyle = COLORS.mid;
        ctx.fillRect(0, 110, WORLD.width, 4);
        drawPixelCloud(150, 160, 150, 44);
        drawPixelCloud(620, 130, 185, 52);
        drawPixelCloud(370, 260, 115, 35);
        ctx.fillStyle = COLORS.deep;
        ctx.fillRect(194, 200, 6, 220);
        ctx.fillRect(690, 186, 6, 234);
        ctx.fillRect(420, 294, 6, 126);
        ctx.fillStyle = COLORS.glow;
        ctx.fillRect(188, 225, 18, 5);
        ctx.fillRect(684, 214, 18, 5);
        ctx.fillRect(414, 318, 18, 5);
        ctx.fillStyle = COLORS.white;
        ctx.font = "bold 11px Courier New, monospace";
        ctx.fillText("AWS Region: US-East-Wizard", 34, 86);
        ctx.fillStyle = COLORS.glow;
        ctx.fillRect(30, 94, 255, 5);
        ctx.fillStyle = COLORS.deep;
        ctx.fillRect(750, 300, 8, 120);
        ctx.fillRect(730, 300, 48, 28);
        ctx.fillStyle = COLORS.arenaLight;
        ctx.font = "9px Courier New, monospace";
        ctx.fillText("CLOUD", 738, 318);
      }

      function drawPixelCloud(x, y, width, height) {
        ctx.fillStyle = COLORS.arenaLight;
        ctx.fillRect(x, y + height / 3, width, height * 0.66);
        ctx.fillRect(x + width * 0.18, y, width * 0.38, height);
        ctx.fillRect(x + width * 0.5, y + height * 0.18, width * 0.32, height * 0.82);
      }

      function drawSlackChannel() {
        ctx.fillStyle = COLORS.arenaLight;
        ctx.fillRect(0, 0, WORLD.width, WORLD.floor);
        ctx.fillStyle = COLORS.deep;
        ctx.fillRect(0, 0, WORLD.width, 48);
        ctx.fillStyle = COLORS.mid;
        ctx.fillRect(0, 48, 190, WORLD.floor - 48);
        ctx.fillStyle = COLORS.ink;
        ctx.fillRect(18, 72, 150, 32);
        ctx.fillRect(18, 122, 150, 32);
        ctx.fillStyle = COLORS.white;
        ctx.font = "bold 13px Courier New, monospace";
        ctx.fillText("#general", 32, 94);
        ctx.fillStyle = COLORS.mid;
        ctx.font = "10px Courier New, monospace";
        ctx.fillText("09:41  @channel:", 230, 112);
        ctx.fillText("10:02  @gandalf:", 230, 205);
        ctx.fillText("10:03  @bot:", 230, 298);
        ctx.fillStyle = COLORS.ink;
        ctx.font = "bold 15px Courier New, monospace";
        ctx.fillText("Who broke build?", 230, 140);
        ctx.fillText("I shall investigate.", 230, 233);
        ctx.fillText("It was probably DNS.", 230, 326);
        ctx.fillStyle = COLORS.purple;
        ctx.fillRect(220, 160, 650, 4);
        ctx.fillRect(220, 253, 650, 4);
        ctx.fillStyle = COLORS.glow;
        ctx.fillRect(820, 76, 82, 12);
        ctx.fillStyle = COLORS.green;
        ctx.fillRect(830, 79, 56, 6);
      }

      function drawStageFloor(stageId) {
        ctx.fillStyle = COLORS.deep;
        ctx.fillRect(0, WORLD.floor, WORLD.width, WORLD.height - WORLD.floor);
        ctx.fillStyle = COLORS.glow;
        ctx.fillRect(0, WORLD.floor, WORLD.width, 4);
        if (stageId === "slack") {
          ctx.fillStyle = COLORS.black;
          ctx.fillRect(270, WORLD.floor + 18, 420, 38);
          ctx.strokeStyle = COLORS.mid;
          ctx.lineWidth = 3;
          ctx.strokeRect(270, WORLD.floor + 18, 420, 38);
          ctx.fillStyle = COLORS.white;
          ctx.font = "bold 17px Courier New, monospace";
          ctx.fillText("[████████░░] 80%", 300, WORLD.floor + 44);
        } else {
          ctx.fillStyle = COLORS.mid;
          for (let x = 0; x < WORLD.width; x += 48) ctx.fillRect(x, WORLD.floor + 25, 3, 52);
          for (let y = WORLD.floor + 25; y < WORLD.height; y += 26) ctx.fillRect(0, y, WORLD.width, 3);
          ctx.fillStyle = COLORS.purple;
          ctx.fillRect(0, WORLD.floor + 8, WORLD.width, 8);
        }
        ctx.fillStyle = COLORS.white;
        ctx.font = "10px Courier New, monospace";
        ctx.fillText("ARC-08", 20, 32);
        ctx.fillText("MAGIC / MACHINE", 770, 32);
        ctx.fillStyle = COLORS.mid;
        ctx.fillRect(420, 80, 120, 4);
        ctx.fillRect(447, 91, 66, 4);
      }

      function drawHud() {
        drawHealthBar(38, 49, 330, player.health, player.name, true);
        drawHealthBar(592, 49, 330, bot.health, bot.name, false, bot.maxHealth, bot.color);
        drawOpponentAvatar(bot);
        drawRoundMarkers(38, playerRoundWins, COLORS.glow);
        drawRoundMarkers(592, botRoundWins, bot.color);
        drawScoreTracker();
        ctx.fillStyle = COLORS.mid;
        ctx.font = "bold 16px Courier New, monospace";
        ctx.textAlign = "center";
        ctx.fillText("VS", WORLD.width / 2, 104);
        ctx.textAlign = "left";
      }

      function drawRoundMarkers(x, wins, color) {
        ctx.fillStyle = COLORS.white;
        ctx.font = "bold 9px Courier New, monospace";
        ctx.textAlign = "left";
        ctx.fillText("ROUNDS", x, 84);
        for (let marker = 0; marker < 2; marker += 1) {
          ctx.fillStyle = marker < wins ? COLORS.glow : COLORS.deep;
          ctx.fillRect(x + 54 + marker * 19, 77, 13, 9);
          ctx.strokeStyle = marker < wins ? COLORS.glow : color;
          ctx.lineWidth = 2;
          ctx.strokeRect(x + 54 + marker * 19, 77, 13, 9);
        }
        ctx.textAlign = "left";
      }

      function drawScoreTracker() {
        ctx.fillStyle = COLORS.glow;
        ctx.font = "bold 13px Courier New, monospace";
        ctx.textAlign = "center";
        ctx.fillText(`ARR SECURED: ${formatMoney(arrSecured)}`, 405, 19);
        ctx.fillStyle = COLORS.mid;
        ctx.font = "bold 10px Courier New, monospace";
        ctx.fillText(`WIN STREAK: ${winStreak}`, 555, 19);
        ctx.textAlign = "left";
      }

      function formatMoney(amount) {
        return `$${amount.toLocaleString("en-US")}`;
      }

      function drawRoundBanner() {
        if (gameOver) return;
        if (koBannerTimer > 0) {
          ctx.fillStyle = COLORS.black;
          ctx.fillRect(320, 150, 320, 78);
          ctx.strokeStyle = COLORS.red;
          ctx.lineWidth = 4;
          ctx.strokeRect(320, 150, 320, 78);
          ctx.fillStyle = COLORS.red;
          ctx.font = "bold 42px Courier New, monospace";
          ctx.textAlign = "center";
          ctx.fillText("K.O.!", WORLD.width / 2, 202);
          ctx.textAlign = "left";
          return;
        }
        if (roundBannerTimer <= 0) return;
        ctx.fillStyle = COLORS.black;
        ctx.fillRect(330, 150, 300, 78);
        ctx.strokeStyle = COLORS.glow;
        ctx.lineWidth = 4;
        ctx.strokeRect(330, 150, 300, 78);
        ctx.fillStyle = COLORS.glow;
        ctx.font = "bold 23px Courier New, monospace";
        ctx.textAlign = "center";
        ctx.fillText(round === 3 ? "FINAL ROUND" : `ROUND ${round}`, WORLD.width / 2, 181);
        ctx.fillStyle = COLORS.white;
        ctx.font = "bold 19px Courier New, monospace";
        ctx.fillText("FIGHT!", WORLD.width / 2, 207);
        ctx.textAlign = "left";
      }

      function drawHealthBar(x, y, width, health, label, isPlayer, maxHealth = 100, barColor = COLORS.mid) {
        ctx.fillStyle = barColor;
        ctx.font = "bold 12px Courier New, monospace";
        ctx.textAlign = isPlayer ? "left" : "right";
        ctx.fillText(label, isPlayer ? x : x + width, y - 10);
        ctx.fillStyle = COLORS.deep;
        ctx.fillRect(x, y, width, 22);
        ctx.fillStyle = health > maxHealth * 0.35 ? barColor : COLORS.red;
        const fillWidth = Math.max(0, width * health / maxHealth);
        ctx.fillRect(isPlayer ? x : x + width - fillWidth, y, fillWidth, 22);
        ctx.strokeStyle = barColor;
        ctx.lineWidth = 3;
        ctx.strokeRect(x, y, width, 22);
        ctx.fillStyle = COLORS.ink;
        ctx.font = "bold 11px Courier New, monospace";
        ctx.textAlign = isPlayer ? "left" : "right";
        ctx.fillText(`${Math.ceil(health)} HP`, isPlayer ? x + 8 : x + width - 8, y + 15);
        ctx.textAlign = "left";
      }

      function drawOpponentAvatar(fighter) {
        ctx.fillStyle = COLORS.black;
        ctx.fillRect(548, 42, 34, 38);
        ctx.strokeStyle = fighter.color;
        ctx.lineWidth = 3;
        ctx.strokeRect(548, 42, 34, 38);
        if (fighter.sprite && fighter.sprite.complete) {
          ctx.drawImage(fighter.sprite, 551, 44, 28, 33);
        } else {
          ctx.save();
          ctx.translate(565, 75);
          ctx.scale(0.38, 0.38);
          drawBotBody(fighter.color, fighter.accent, 0);
          ctx.restore();
        }
      }

      function drawFighter(fighter) {
        const x = Math.round(fighter.x);
        const y = Math.round(fighter.y);
        const moving = Math.abs(fighter.vx) > 0.4 && fighter.grounded;
        const step = moving ? (Math.floor(fighter.walkCycle / 5) % 2) * 5 : 0;
        const primary = fighter.flashTimer > 0 ? COLORS.glow : fighter.color;
        const secondary = fighter.flashTimer > 0 ? COLORS.mid : fighter.accent;
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(fighter.facing, 1);
        ctx.imageSmoothingEnabled = false;

        ctx.fillStyle = COLORS.black;
        ctx.fillRect(-27, -2, 54, 7);
        ctx.fillRect(-17, 5, 34, 5);

        if (fighter.isPlayer) drawWizardBody(primary, secondary, step, fighter);
        else if (fighter.sprite && fighter.sprite.complete) ctx.drawImage(fighter.sprite, -40, -84, 80, 84);
        else drawBotBody(primary, secondary, step);

        if (fighter.meleeTimer > 0) {
          ctx.fillStyle = primary;
          if (fighter.meleeType === "kick") {
            ctx.fillStyle = COLORS.blueDark;
            ctx.fillRect(5, 19, 12, 22);
            ctx.fillStyle = primary;
            ctx.fillRect(12, 21, 38, 9);
            ctx.fillRect(43, 18, 12, 8);
            ctx.fillStyle = COLORS.glow;
            ctx.fillRect(51, 16, 7, 5);
          } else {
            ctx.fillStyle = COLORS.blueDark;
            ctx.fillRect(18, 3, 11, 11);
            ctx.fillStyle = primary;
            ctx.fillRect(18, -5, 28, 8);
            ctx.fillRect(41, -9, 9, 7);
            ctx.fillStyle = COLORS.glow;
            ctx.fillRect(47, -10, 6, 5);
          }
        }

        if (fighter.shielding) {
          ctx.strokeStyle = COLORS.mid;
          ctx.lineWidth = 5;
          ctx.beginPath();
          ctx.arc(fighter.facing * 28, -38, 34, -Math.PI * 0.62, Math.PI * 0.62);
          ctx.stroke();
          ctx.fillStyle = COLORS.white;
          ctx.fillRect(fighter.facing * 47 - 3, -42, 6, 8);
        }

        if (fighter.attackTimer > 0) {
          ctx.fillStyle = COLORS.glow;
          ctx.fillRect(17, -61, 5, 55);
          ctx.fillRect(22, -64, 5, 7);
          ctx.fillRect(27, -61, 5, 5);
        }
        ctx.restore();
      }

      function drawWizardBody(primary, secondary, step, fighter) {
        ctx.fillStyle = COLORS.blueDark;
        ctx.fillRect(-18, -38, 36, 8);
        ctx.fillStyle = COLORS.white;
        ctx.fillRect(-15, -30, 30, 17);
        ctx.fillRect(-11, -13, 22, 12);
        ctx.fillStyle = COLORS.gold;
        ctx.fillRect(-13, -28, 10, 5);
        ctx.fillRect(3, -28, 10, 5);
        ctx.fillRect(-3, -27, 6, 3);
        ctx.fillStyle = COLORS.blueDark;
        ctx.fillRect(-21, -3, 42, 11);
        ctx.fillRect(-17, 8, 34, 12);
        ctx.fillStyle = COLORS.deep;
        ctx.fillRect(-17, 18, 34, 5);
        ctx.fillStyle = COLORS.mid;
        ctx.fillRect(-20, 4, 8, 10);
        ctx.fillRect(12, 4, 8, 10);
        ctx.fillStyle = COLORS.mid;
        if (fighter.meleeTimer <= 0 || fighter.meleeType !== "kick") ctx.fillRect(5, 20, 10, 19 - step);
        ctx.fillRect(-14, 20, 10, 19 + step);
        ctx.fillStyle = COLORS.black;
        ctx.fillRect(-19, 39 + step, 15, 5);
        if (fighter.meleeTimer <= 0 || fighter.meleeType !== "kick") ctx.fillRect(4, 39 - step, 15, 5);
        ctx.fillStyle = COLORS.blueDark;
        ctx.fillRect(18, 4, 10, 7);
        ctx.fillRect(-29, 4, 10, 7);
        ctx.fillStyle = COLORS.gold;
        ctx.fillRect(28, -49, 4, 48);
        ctx.fillRect(25, -52, 10, 5);
        ctx.fillStyle = COLORS.green;
        ctx.fillRect(24, -60, 12, 8);
        ctx.fillRect(27, -63, 6, 3);
        ctx.fillStyle = COLORS.white;
        ctx.fillRect(-10, -13, 20, 5);
      }

      function drawBotBody(primary, secondary, step) {
        ctx.fillStyle = COLORS.blueDark;
        ctx.fillRect(-20, -3, 40, 14);
        ctx.fillRect(-16, 11, 32, 13);
        ctx.fillStyle = COLORS.mid;
        ctx.fillRect(-15, 24, 10, 16 + step);
        ctx.fillRect(5, 24, 10, 16 - step);
        ctx.fillStyle = COLORS.black;
        ctx.fillRect(-19, 40 + step, 15, 5);
        ctx.fillRect(4, 40 - step, 15, 5);
        ctx.fillStyle = COLORS.blueDark;
        ctx.fillRect(19, 1, 13, 9);
        ctx.fillRect(-32, 1, 13, 9);
        ctx.fillStyle = COLORS.black;
        ctx.fillRect(-18, -38, 36, 8);
        ctx.fillRect(-13, -30, 26, 20);
        ctx.fillStyle = COLORS.red;
        ctx.fillRect(-10, -25, 20, 6);
        ctx.fillStyle = COLORS.glow;
        ctx.fillRect(-6, -24, 4, 3);
        ctx.fillRect(3, -24, 4, 3);
        ctx.fillStyle = COLORS.white;
        ctx.fillRect(-5, 0, 10, 4);
      }

      function drawProjectiles() {
        projectiles.forEach((spell) => {
          ctx.fillStyle = spell.color || COLORS.mid;
          ctx.fillRect(Math.round(spell.x - 12), Math.round(spell.y - 4), 24, 8);
          ctx.fillStyle = spell.color || COLORS.glow;
          ctx.fillRect(Math.round(spell.x - 7), Math.round(spell.y - 9), 14, 18);
          ctx.fillStyle = COLORS.ink;
          ctx.fillRect(Math.round(spell.x - 3), Math.round(spell.y - 3), 6, 6);
        });
      }

      function drawParticles() {
        particles.forEach((particle) => {
          ctx.fillStyle = particle.color;
          ctx.fillRect(Math.round(particle.x), Math.round(particle.y), particle.size, particle.size);
        });
      }

      function loop(now) {
        update(now - lastTime);
        draw();
        lastTime = now;
        requestAnimationFrame(loop);
      }

      resetRound();
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
